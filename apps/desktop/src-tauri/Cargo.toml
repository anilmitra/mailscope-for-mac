[package]
name = "mailscope-desktop"
version = "0.1.0"
description = "MailScope for Mac"
authors = []
edition = "2021"
default-run = "mailscope-desktop"

[lib]
name = "mailscope_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
mailscope-core = { path = "../../../crates/core" }
mailscope-storage = { path = "../../../crates/storage" }
mailscope-diagnostics = { path = "../../../crates/diagnostics" }
mailscope-connector-gmail = { path = "../../../crates/connectors/gmail" }
mailscope-connector-microsoft = { path = "../../../crates/connectors/microsoft" }
mailscope-connector-imap = { path = "../../../crates/connectors/imap" }
mailscope-reporting = { path = "../../../crates/reporting" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
